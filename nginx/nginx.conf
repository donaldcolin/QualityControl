worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # MIME types: Use /etc/nginx/mime.types on Linux servers, or /opt/homebrew/etc/nginx/mime.types on Mac
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Buffer settings to prevent HTTP 414 Request-URI Too Large on batch URL queries
    large_client_header_buffers 4 16k;
    client_header_buffer_size 4k;

    # SSL Settings (Self-signed for local development, replace with real certs for prod)
    # ssl_certificate      /etc/nginx/ssl/cert.pem;
    # ssl_certificate_key  /etc/nginx/ssl/key.pem;
    # ssl_protocols TLSv1.2 TLSv1.3;

    # Limit API request size (e.g. for audio uploads)
    client_max_body_size 500M;

    server {
        listen 80;
        # listen 443 ssl;
        server_name localhost;

        # Serve React Frontend (Update path to your production deployment directory)
        location / {
            root /var/www/quality-control/frontend/dist; # Or local path for dev testing
            index index.html index.htm;
            try_files $uri $uri/ /index.html;
        }

        # Proxy Node.js API
        location /api/ {
            proxy_pass http://127.0.0.1:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # SSE specific settings (no buffering)
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;
            proxy_read_timeout 300s;
        }

        # Proxy Python ASR Webhooks (e.g. Meet ingestion)
        location /api/webhook/ {
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
